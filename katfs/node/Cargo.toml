[package]
name = "katfs-node"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "katfs-node"
path = "src/main.rs"

[dependencies]
iroh = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tiny_http = "0.12"

[profile.release]
opt-level = 2
