---
http:
  services:
    srv-agents:
      loadBalancer:
        servers:
          - url: "http://10.0.0.240:8700"
        passHostHeader: true

  middlewares:
    agents-auth:
      basicAuth:
        users:
          - "admin:$2b$10$<BCRYPT-HASH>"

  routers:
    rtr-agents:
      rule: "Host(`agents.kat56.de`)"
      service: srv-agents
      entryPoints:
        - websecure
      middlewares:
        - agents-auth
