<!doctype html>
<!-- kAIm56 — self-hosted Firecracker AI-agent platform
     SPDX-License-Identifier: AGPL-3.0-or-later
     Job board: the smallest app on the platform. Left the runs of the daily
     job-search task (from /api/tasks and the task chat), right a chat with
     the jobresearcher instance (/api/chat/<instance>, streamed). No backend
     of its own: the agent is the backend. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job board · kAIm56</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--text:#1b1b1b;--muted:#6b6b6b;--border:#d9d6cf;--accent:#0b5cad;--me:#e8f0fb}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--panel:#1d1d1d;--text:#ececec;--muted:#9a9a9a;--border:#333;--accent:#6fa8e8;--me:#22303f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
header h1{font-size:16px;margin:0}header a{color:var(--muted);text-decoration:none;font-size:13px}header .grow{flex:1}
button{font:inherit;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}button:disabled{opacity:.5;cursor:default}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);min-height:0}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
section{min-height:0;display:flex;flex-direction:column}
#runs{overflow:auto;padding:14px 16px;border-right:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}.bar .grow{flex:1}
.job{background:var(--panel);border:1px solid var(--border);padding:10px 12px;margin-bottom:10px;position:relative}
.job.gone{opacity:.55}
.job .row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-right:52px}.job a{color:var(--accent);text-decoration:none}.job a:hover{text-decoration:underline}
.job .row2{font-size:13px;margin-top:2px}.job .row3{font-size:12px;color:var(--muted);margin-top:4px}
.job .note{font-size:12.5px;margin-top:6px;border-left:2px solid var(--border);padding-left:8px;white-space:pre-wrap}
.tag{font-size:11px;border:1px solid var(--border);padding:1px 6px;color:var(--muted)}
.job .more{position:absolute;top:8px;right:8px;font-size:14px;padding:2px 8px;line-height:1}
.menu{position:fixed;z-index:9;background:var(--panel);border:1px solid var(--border);box-shadow:0 6px 20px rgba(0,0,0,.18);min-width:220px;padding:4px 0}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 12px;font-size:13px}
.menu button:hover{background:var(--me);color:var(--text)}
.menu .sep{border-top:1px solid var(--border);margin:4px 0}
#rules{margin:0 0 10px}#rules summary{cursor:pointer;font-size:12px;color:var(--muted)}
#rules .rule{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
#rules .rule span{flex:1}#rules .rule button{font-size:11px;padding:1px 6px}
#chat{display:flex;flex-direction:column}
#log{flex:1;overflow:auto;padding:14px 16px}
.msg{max-width:92%;margin:0 0 10px;padding:8px 11px;border:1px solid var(--border);background:var(--panel);white-space:pre-wrap;word-break:break-word}
.msg.me{margin-left:auto;background:var(--me)}
#compose{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--border);background:var(--panel)}
#compose textarea{flex:1;font:inherit;resize:none;padding:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);min-height:40px;max-height:160px}
.muted{color:var(--muted);font-size:12px}
</style></head><body>
<header><h1>💼 Job board</h1><span class=muted id=status>…</span><span class=grow></span>
  <button id=runNow title="Queue the daily task now">Run search now</button>
  <a href="/chat?i=jobresearcher">Open chat</a> · <a href="/">Manager</a></header>
<main>
  <section><div id=runs>
    <div class=bar><span id=count class=muted>…</span><span class=grow></span>
      <label class=muted><input type=checkbox id=showGone> show gone</label></div>
    <details id=rules><summary>Exclusions (playbook of jobresearcher)</summary><div id=ruleList></div></details>
    <div id=jobs><p class=muted>Loading jobs…</p></div></div></section>
<div id=menu class=menu hidden></div>
  <section id=chat><div id=log><p class=muted>Ask the jobresearcher about a posting — ⋯ or right-click on a job.</p></div>
    <div id=compose><textarea id=t placeholder="Ask jobresearcher… (Enter sends, Shift+Enter newline)"></textarea><button id=send>Send</button></div></section>
</main>
<script>
/* One card per JOB, merged across runs. The agent writes runs/<date>.json
   into its workspace after every search (a list of postings, see the task
   text); the manager serves those read-only (/api/workspace). Merging is
   done HERE, deterministically, by the posting's URL: first seen, last
   seen, how many runs, and whether the latest run still lists it. */
const INSTANCE='jobresearcher', $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=ts=>new Date(ts*1000).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
const days=d=>{const n=Math.round((Date.now()-new Date(d+'T12:00:00').getTime())/864e5);return n<=0?'today':n===1?'1 day':n+' days'};
const norm=u=>String(u||'').trim().replace(/^http:/,'https:').replace(/[?#].*$/,'').replace(/\/+$/,'').toLowerCase();
let TASK=null,JOBS=[],LATEST='',RULES=[];
/* Exclusions live in the instance's PLAYBOOK — the fixed rules the agent
   gets every turn — so the daily search stops listing them too. The board
   writes them in one recognisable shape and reads them back to hide cards. */
const RULE_RE=/^Job search: never list (company|role) "([^"]+)"/i;
const ruleText=(kind,val)=>`Job search: never list ${kind} "${val}" — Ulrich excluded it on the job board; do not report or count such postings again, not even as "known".`;
async function loadRules(){
  try{RULES=((await (await fetch('/api/playbooks?instance='+encodeURIComponent(INSTANCE))).json()).playbooks||[])
    .map(p=>{const m=RULE_RE.exec(p.text||'');return m?{id:p.id,kind:m[1].toLowerCase(),val:m[2],text:p.text}:null}).filter(Boolean)}catch(e){RULES=[]}
  $('ruleList').innerHTML=RULES.length?RULES.map(r=>`<div class=rule><span>${r.kind==='company'?'🏢':'🎯'} ${esc(r.kind)}: <b>${esc(r.val)}</b></span>`+
    `<button onclick="removeRule('${esc(r.id)}')">remove</button></div>`).join(''):'<div class=muted style="font-size:12px">none — use ⋯ on a card</div>';
  $('rules').querySelector('summary').textContent=`Exclusions (${RULES.length}) — playbook of ${INSTANCE}`;
}
const excluded=j=>RULES.some(r=>r.kind==='company'?String(j.company||'').trim().toLowerCase()===r.val.trim().toLowerCase()
  :String(j.title||'').toLowerCase().includes(r.val.trim().toLowerCase()));
async function addRule(kind,val){
  if(!val)return;
  const r=await fetch('/api/playbook-add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instance:INSTANCE,text:ruleText(kind,val)})}).then(r=>r.json()).catch(()=>({}));
  await loadRules();draw();
}
async function removeRule(id){
  await fetch('/api/playbook-remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instance:INSTANCE,id})});
  await loadRules();draw();
}
function openMenu(i,x,y){
  const j=JOBS[i],m=$('menu');
  m.innerHTML=`<button onclick="askAbout(${i});closeMenu()">💬 Ask about this posting</button><div class=sep></div>`+
    (j.company?`<button onclick="addRule('company',${JSON.stringify(j.company)});closeMenu()">🏢 Exclude company “${esc(j.company)}”</button>`:'')+
    (j.title?`<button onclick="addRule('role',${JSON.stringify(j.title)});closeMenu()">🎯 Exclude role “${esc(j.title)}”</button>`:'');
  m.hidden=false;const w=m.offsetWidth||240,h=m.offsetHeight||120;
  m.style.left=Math.min(x,innerWidth-w-8)+'px';m.style.top=Math.min(y,innerHeight-h-8)+'px';
}
function closeMenu(){$('menu').hidden=true}
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
async function loadTask(){
  const tasks=await fetch('/api/tasks').then(r=>r.json());
  const list=Array.isArray(tasks)?tasks:(tasks.tasks||[]);
  TASK=list.find(t=>t.instance===INSTANCE&&t.schedule)||list.find(t=>t.instance===INSTANCE)||null;
  $('status').textContent=TASK?`daily task · ${TASK.status}${TASK.next_run?' · next '+fmt(TASK.next_run):''}`:'no task for '+INSTANCE;
  $('runNow').disabled=!TASK;
}
async function loadJobs(){
  const dir=await fetch(`/api/workspace/${INSTANCE}/runs`).then(r=>r.ok?r.json():{entries:[]});
  const files=(dir.entries||[]).filter(e=>!e.dir&&/^\d{4}-\d{2}-\d{2}\.json$/.test(e.name)).map(e=>e.name).sort();
  const byUrl=new Map();
  for(const f of files){
    const date=f.slice(0,10);
    let items=[];try{const d=await fetch(`/api/workspace/${INSTANCE}/runs/${f}`).then(r=>r.json());items=Array.isArray(d)?d:(d.jobs||[])}catch(e){continue}
    for(const it of items){
      const key=norm(it.url||it.job_url)||(String(it.title||'')+'@'+String(it.company||'')).toLowerCase();
      if(!key||key==='@')continue;
      const j=byUrl.get(key)||{key,first:date,runs:0,history:[]};
      Object.assign(j,{title:it.title||j.title,company:it.company||j.company,location:it.location||j.location,
        url:it.url||it.job_url||j.url,remote:it.remote??j.remote,source:it.source||it.site||j.source,
        posted:it.date_posted||it.posted||j.posted,verdict:it.verdict||it.fit||j.verdict,note:it.note||it.notes||j.note,last:date});
      j.runs++;j.history.push(date);byUrl.set(key,j);
    }
  }
  LATEST=files.length?files[files.length-1].slice(0,10):'';
  JOBS=[...byUrl.values()].map(j=>({...j,gone:!!LATEST&&j.last!==LATEST})).sort((a,b)=>(a.gone-b.gone)||(b.first>a.first?1:-1)||(a.title||'').localeCompare(b.title||''));
  draw();
}
function draw(){
  const showGone=$('showGone').checked,vis=JOBS.filter(j=>!excluded(j)),list=vis.filter(j=>showGone||!j.gone),nx=JOBS.length-vis.length;
  $('count').textContent=JOBS.length?`${vis.filter(j=>!j.gone).length} open · ${vis.filter(j=>j.gone).length} gone${nx?` · ${nx} excluded`:''} · latest run ${LATEST}`:'';
  if(!JOBS.length){$('jobs').innerHTML='<p class=muted>No structured runs yet (workspace/runs/&lt;date&gt;.json). The next search writes the first one — press “Run search now”.</p>';return}
  $('jobs').innerHTML=list.map((j,i)=>`<div class="job${j.gone?' gone':''}" oncontextmenu="event.preventDefault();openMenu(${JOBS.indexOf(j)},event.clientX,event.clientY)">
    <div class=row1><a href="${esc(j.url)}" target=_blank rel=noopener><b>${esc(j.title||'(untitled)')}</b></a>
      ${j.verdict?`<span class=tag>${esc(j.verdict)}</span>`:''}${j.remote===true||/remote|hybrid/i.test(String(j.remote||''))?`<span class=tag>${esc(j.remote===true?'remote':j.remote)}</span>`:''}</div>
    <div class=row2>${esc(j.company||'')}${j.location?' · '+esc(j.location):''}${j.source?' · '+esc(j.source):''}</div>
    <div class=row3>first seen <b>${esc(j.first)}</b> (${days(j.first)}) · seen in ${j.runs} run${j.runs>1?'s':''}${j.gone?` · <b>gone</b> since ${esc(j.last)}`:''}${j.posted?' · posted '+esc(j.posted):''}</div>
    ${j.note?`<div class=note>${esc(j.note)}</div>`:''}
    <button class=more title="Ask · exclude company/role" onclick="event.stopPropagation();openMenu(${JOBS.indexOf(j)},event.clientX,event.clientY)">⋯</button></div>`).join('')||'<p class=muted>Nothing open. Tick “show gone”.</p>';
}
function askAbout(i){const j=JOBS[i];$('t').value=`About this posting: ${j.title||''} at ${j.company||''} (${j.url||''})\n\nMy question: `;$('t').focus();$('t').setSelectionRange($('t').value.length,$('t').value.length)}
$('showGone').onchange=draw;
$('runNow').onclick=async()=>{if(!TASK)return;$('runNow').disabled=true;
  const r=await fetch(`/api/tasks/${TASK.id}/run`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msg:'run'})}).then(r=>r.json()).catch(()=>({msg:'failed'}));
  $('status').textContent=r.msg||'queued';setTimeout(refresh,90000);setTimeout(()=>{$('runNow').disabled=false},5000)};
function add(text,me){const d=document.createElement('div');d.className='msg'+(me?' me':'');d.textContent=text;$('log').appendChild(d);$('log').scrollTop=1e9;return d}
async function send(){
  const text=$('t').value.trim();if(!text)return;$('t').value='';add(text,true);$('send').disabled=true;
  const bot=add('…',false);
  try{
    const r=await fetch('/api/chat/'+encodeURIComponent(INSTANCE),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,chat:'app-jobboard'})});
    const rd=r.body.getReader(),dec=new TextDecoder();let acc='';
    for(;;){const {value,done}=await rd.read();if(done)break;acc+=dec.decode(value,{stream:true});bot.textContent=acc;$('log').scrollTop=1e9}
    bot.textContent=acc.trim()||'(empty answer)';
  }catch(e){bot.textContent='⚠️ '+e}
  $('send').disabled=false;
}
$('send').onclick=send;
$('t').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
async function refresh(){try{await loadTask();await loadRules();await loadJobs()}catch(e){$('jobs').innerHTML='<p class=muted>⚠️ '+esc(e)+'</p>'}}
refresh();setInterval(refresh,120000);
</script></body></html>
